services:
  livekit:
    image: livekit/livekit-server:latest
    command: --dev --bind 0.0.0.0
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"

  voice-api:
    build: .
    command: uvicorn api:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - .:/app

# NOTE: agent.py runs locally outside Docker during development.
# livekit-agents requires direct network access to the LiveKit server
# for the worker WebSocket connection. Run it with:
#   python agent.py dev
# after starting the livekit service above.
